<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="amberSphere" cx="35%" cy="30%" r="70%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="225" fill="url(#amberSphere)" filter="url(#amberGlow)"/>
  <circle cx="256" cy="256" r="223" fill="none" stroke="#FFE082" stroke-width="4" stroke-opacity="0.7"/>

  <g transform="translate(256, 275)" filter="url(#whiteGlow)">
    <path d="M -135 -75 A 160 160 0 0 1 135 -75" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" />
    <path d="M -90 -25 A 108 108 0 0 1 90 -25" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" />
    <path d="M -48 25 A 58 58 0 0 1 48 25" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
    <circle cx="0" cy="72" r="24" fill="#FFFFFF" />
  </g>
</svg>
