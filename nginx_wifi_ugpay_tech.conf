# Nginx Server Block for wifi.ugpay.tech
# Frontend SPA path: /var/www/wipay_SPA
# Backend API proxy: http://127.0.0.1:5010

server {
    listen 80;
    listen [::]:80;
    server_name wifi.ugpay.tech;

    root /var/www/wipay_SPA;
    index index.html;

    # 1. React SPA static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 2. Node.js API Proxy (Port 5010)
    location /api {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Static Uploads directory
    location /uploads {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 4. WebSockets / Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
